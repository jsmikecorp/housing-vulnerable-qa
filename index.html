    var blk=new Int32Array(16); blk[8]=0x80000000|0; blk[15]=768;

function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

function norm(s){return String(s||'').replace(IGN_RE,'').toLowerCase()}
function utf8(s){return new TextEncoder().encode(s)}
function hasSubtle(){try{return!!(window.crypto&&crypto.subtle&&crypto.subtle.deriveKey)}catch(e){return false}}
function dS(pw){var cs=crypto.subtle;return cs.importKey('raw',utf8(pw),'PBKDF2',false,['deriveKey']).then(function(km){return cs.deriveKey({name:'PBKDF2',salt:b64(ENC.salt),iterations:ENC.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt'])}).then(function(k){return cs.decrypt({name:'AES-GCM',iv:b64(ENC.iv)},k,b64(ENC.ct))}).then(function(p){return new Uint8Array(p)})}
function dF(pw,onP){return MiniCrypto.pbkdf2(utf8(pw),b64(ENC.salt),ENC.iter,onP).then(function(k){return MiniCrypto.gcmDecrypt(k,b64(ENC.iv),b64(ENC.ct))})}
var BAD='BADPW';function decrypt(pw,onP){var fb=function(){return dF(pw,onP).catch(function(){throw BAD})};if(window.FORCE_FALLBACK||!hasSubtle())return fb();return dS(pw).catch(function(e){if(e&&e.name==='OperationError')throw BAD;return fb()})}

var onP=function(r){p.classList.remove('hidden');p.firstChild.style.width=Math.round(r*100)+'%'};var pw=$('#pw').value;

f.addEventListener('click',function(e){var s=e.target.dataset.s;if(!s)return;SRC=s;[].forEach.call(f.children,function(x){x.classList.toggle('on',x.dataset.s===s)});run()});

function hl(s,kws){s=esc(s);if(!kws.length)return s;kws.forEach(function(k){var pat=k.split('').map(function(ch){return ch.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}).join('['+IGN+']*');try{s=s.replace(new RegExp('('+pat+')','gi'),'<mark>$1</mark>')}catch(e){}});return s}
function run(){var raw=$('#q').value,kws=raw.split(/[,+，]/).map(norm).filter(Boolean);
var R=IDX.filter(function(x){return(SRC==='전체'||x.c.src===SRC)&&kws.every(function(k){return x.t.indexOf(k)>=0})});

return '<details class="card"'+(kws.length&&R.length<=3?' open':'')+'><summary><span class="tag">'+esc(c.src)+'</span>'+hl(c.title,kws)+'</summary><div class="body">'+
