  }
  // 상태 st 에서 이어서 bytes 를 해시 (prefixLen: 이미 처리된 바이트 수)
  function hashFrom(st, bytes, prefixLen){
    var len=bytes.length, total=len+prefixLen, nb=((len+9+63)>>6), buf=new Uint8Array(nb*64);
    buf.set(bytes); buf[len]=0x80;
    var bits=total*8, end=nb*64;

    buf[end-5]=Math.floor(bits/4294967296)&255;
    var s=Int32Array.from(st), m=new Int32Array(16);
    for (var bl=0; bl<nb; bl++){
      for (var j=0;j<16;j++){ var o=bl*64+j*4; m[j]=(buf[o]<<24)|(buf[o+1]<<16)|(buf[o+2]<<8)|buf[o+3]; }
      compress(s, m, s);
    }
    return s;
  }
  function wordsToBytes(w){ var b=new Uint8Array(w.length*4); for (var i=0;i<w.length;i++){ b[i*4]=w[i]>>>24; b[i*4+1]=w[i]>>>16; b[i*4+2]=w[i]>>>8; b[i*4+3]=w[i]; } return b; }
  function sha256(bytes){ return wordsToBytes(hashFrom(IV, bytes, 0)); }

  function pbkdf2(pwBytes, salt, iter, onProgress){

    for (i=0;i<16;i++) m[i]=(op[i*4]<<24)|(op[i*4+1]<<16)|(op[i*4+2]<<8)|op[i*4+3];

    var inner=hashFrom(istate, msg, 64);

    var blk=new Int32Array(16); blk[8]=0x80000000|0; blk[15]=768;
    var tmp=new Int32Array(8);
    var step = Math.max(1, Math.floor(iter/50));
    return new Promise(function(resolve){
      var n=1;
      function run(){
        var stop=Math.min(iter, n+step);
        for (; n<stop; n++){
          for (var j=0;j<8;j++) blk[j]=u[j];
          compress(istate, blk, tmp);
          for (j=0;j<8;j++) blk[j]=tmp[j];
          compress(ostate, blk, u);

      if (i%nk===0){

var f=$('#fsrc');['전체'].concat(DB.sources).forEach(function(s){var b=document.createElement('button');b.type='button';b.className='chip'+(s===SRC?' on':'');b.textContent=s;b.dataset.s=s;f.appendChild(b)});
f.addEventListener('click',function(e){var s=e.target.dataset.s;if(!s)return;SRC=s;[].forEach.call(f.children,function(x){x.classList.toggle('on',x.dataset.s===s)});run()});
var qk=$('#quick');['입주대상자','소득','자산','이주비','전세임대','매입임대','재계약','운영기관','신청서류'].forEach(function(w){var b=document.createElement('button');b.type='button';b.className='chip';b.textContent=w;b.onclick=function(){$('#q').value=w;run()};qk.appendChild(b)});
$('#q').addEventListener('input',run);run()}
function hl(s,kws){s=esc(s);if(!kws.length)return s;kws.forEach(function(k){var pat=k.split('').map(function(ch){return ch.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}).join('['+IGN+']*');try{s=s.replace(new RegExp('('+pat+')','gi'),'<mark>$1</mark>')}catch(e){}});return s}
function run(){var raw=$('#q').value,kws=raw.split(/[,+，]/).map(norm).filter(Boolean);
var R=IDX.filter(function(x){return(SRC==='전체'||x.c.src===SRC)&&kws.every(function(k){return x.t.indexOf(k)>=0})});
$('#count').textContent=(kws.length?'검색 결과 ':'전체 ')+R.length+'건';
$('#results').innerHTML=R.map(function(x){var c=x.c,qa=c.question&&c.question!==c.title;
return '<details class="card"'+(kws.length&&R.length<=3?' open':'')+'><summary><span class="tag">'+esc(c.src)+'</span>'+hl(c.title,kws)+'</summary><div class="body">'+
(qa?'<span class="lbl">질의</span>'+hl(c.question,kws):'')+'<span class="lbl">'+(c.category==='qna'?'답변':'내용')+'</span>'+hl(c.answer,kws)+
'<span class="lbl">출처</span><a href="'+esc(c.source_url)+'" target="_blank" rel="noopener">'+esc(c.source)+'</a>'+(c.notes?'<div class="note">※ '+esc(c.notes)+'</div>':'')+'</div></details>'}).join('')}
})();
</script></body></html>
